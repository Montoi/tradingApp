version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: tradingdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_orchestrator
    restart: unless-stopped
    init: true # CRÍTICO: Gestiona el ciclo de vida de los procesos hijos (PIDs huérfanos)
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:secretpassword@database:5432/tradingdb?schema=public
    volumes:
      - shared_output:/app/output
    depends_on:
      - database
    command: >
      sh -c "npx prisma db push && npm run api"

  ai_processor:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: trading_ai_processor
    restart: unless-stopped
    volumes:
      - shared_output:/app/output
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:3001
    env_file:
      - .env
    depends_on:
      - orchestrator

  frontend:
    build:
      context: ../tradingAppReact
      dockerfile: Dockerfile
    container_name: trading_frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - orchestrator

volumes:
  shared_output:
  pgdata: